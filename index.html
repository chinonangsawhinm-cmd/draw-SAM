<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw-SAM - Web Drawing Application</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🎨 Draw-SAM</h1>
    <div class="tools">
      <button id="btn-save">💾 บันทึกขึ้น Cloud</button>
      <button id="btn-clear">🗑️ ล้างกระดาน</button>
    </div>
  </header>
  
  <main>
    <aside class="toolbar">
      <h3>เครื่องมือ</h3>
      <input type="color" id="color-picker" value="#000000" title="เลือกสี">
      <input type="range" id="brush-size" min="1" max="50" value="5" title="ขนาดแปรง">
    </aside>
    <div class="canvas-container">
      <canvas id="drawing-canvas"></canvas>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
